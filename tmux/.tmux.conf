# ~/.tmux.conf

# Make Esc respond immediately. The default 500ms delay makes Esc (interrupt) feel laggy.
set -s escape-time 10

# Pass modified keys through so Shift+Enter (newline) and similar combos work
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Full color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Send focus changes to apps and allow OSC passthrough (notifications, hyperlinks)
set -g focus-events on
set -g allow-passthrough on

# Let copy (OSC 52) reach your system clipboard, including over SSH
set -s set-clipboard on

# Mouse wheel scrolling, plus a bigger scrollback for long sessions
set -g mouse on
set -g history-limit 50000

# Flag windows where Claude finished or needs input (works with the bell setting below)
set -g monitor-bell on
set -g bell-action any

# Use Ctrl+a as the prefix instead of Ctrl+b (prefix + a sends a literal Ctrl+a)
unbind C-b
set -g prefix C-a
bind a send-prefix

# Split panes with | (side by side) and - (top/bottom), opening in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle to the next pane: hold Ctrl and press a twice (repeat to keep cycling)
bind C-a select-pane -t :.+

# Machine-specific overrides (not in the dotfiles repo)
source-file -q ~/.tmux.local.conf
